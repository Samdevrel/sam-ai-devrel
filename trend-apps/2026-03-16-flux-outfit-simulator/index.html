<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux One-Prompt Outfit Simulator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #ff00ff;
            color: #000;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #ffff00;
            border: 10px solid #000;
            box-shadow: 20px 20px 0 #000;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2em;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 5px 5px 0 #fff;
        }
        .upload-area {
            border: 5px dashed #000;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            background: #fff;
        }
        .upload-area input {
            margin-top: 10px;
        }
        .prompt-section {
            margin-bottom: 20px;
        }
        .prompt-input {
            width: 100%;
            padding: 10px;
            border: 5px solid #000;
            font-size: 1em;
            box-shadow: 5px 5px 0 #000;
        }
        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .example-btn {
            background: #00ff00;
            border: 5px solid #000;
            padding: 10px;
            cursor: pointer;
            box-shadow: 5px 5px 0 #000;
            font-weight: bold;
        }
        .example-btn:hover {
            box-shadow: 7px 7px 0 #000;
        }
        .generate-btn {
            background: #ff0000;
            color: #fff;
            border: 5px solid #000;
            padding: 15px;
            font-size: 1.2em;
            cursor: pointer;
            box-shadow: 5px 5px 0 #000;
            margin-bottom: 20px;
            width: 100%;
        }
        .generate-btn:hover {
            box-shadow: 7px 7px 0 #000;
        }
        .comparison {
            position: relative;
            width: 100%;
            height: 400px;
            overflow: hidden;
            border: 5px solid #000;
            box-shadow: 10px 10px 0 #000;
            margin-bottom: 20px;
        }
        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        .before-img, .after-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .after-img {
            clip-path: inset(0 0 0 0);
        }
        .slider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 10px;
            height: 100%;
            background: #000;
            cursor: ew-resize;
            z-index: 10;
        }
        .slider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -10px;
            width: 30px;
            height: 30px;
            background: #fff;
            border: 5px solid #000;
            border-radius: 50%;
            transform: translateY(-50%);
        }
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            background: #00ffff;
            border: 5px solid #000;
            padding: 10px 20px;
            cursor: pointer;
            box-shadow: 5px 5px 0 #000;
            font-weight: bold;
        }
        .btn:hover {
            box-shadow: 7px 7px 0 #000;
        }
        .credits {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8em;
        }
        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            h1 {
                font-size: 1.5em;
            }
            .examples {
                flex-direction: column;
            }
            .buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Flux One-Prompt Outfit Simulator</h1>
        <div class="upload-area">
            <p>Upload a photo of a person</p>
            <input type="file" id="upload" accept="image/*">
        </div>
        <div class="prompt-section">
            <input type="text" class="prompt-input" id="prompt" placeholder="Enter outfit style prompt (e.g., cyberpunk streetwear)">
        </div>
        <div class="examples">
            <button class="example-btn" onclick="setPrompt('cyberpunk streetwear')">Cyberpunk Streetwear</button>
            <button class="example-btn" onclick="setPrompt('Victorian gown')">Victorian Gown</button>
            <button class="example-btn" onclick="setPrompt('banana peel couture')">Banana Peel Couture</button>
            <button class="example-btn" onclick="setPrompt('medieval knight armor')">Medieval Knight Armor</button>
            <button class="example-btn" onclick="setPrompt('futuristic space suit')">Futuristic Space Suit</button>
        </div>
        <button class="generate-btn" onclick="generate()">Generate Simulated Outfit</button>
        <div class="comparison" id="comparison" style="display: none;">
            <div class="image-container">
                <img id="before-img" class="before-img" src="" alt="Before">
                <img id="after-img" class="after-img" src="" alt="After">
                <div class="slider" id="slider"></div>
            </div>
        </div>
        <div class="buttons" id="buttons" style="display: none;">
            <button class="btn" onclick="download()">Download Result</button>
            <button class="btn" onclick="share()">Share to X</button>
        </div>
    </div>
    <div class="credits">
        Powered by Flux AI. This is a demo; the real version would use the Flux API.
    </div>
    <script>
        let uploadedImage = null;
        let simulatedImage = null;

        document.getElementById('upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImage = event.target.result;
                    document.getElementById('before-img').src = uploadedImage;
                };
                reader.readAsDataURL(file);
            }
        });

        function setPrompt(prompt) {
            document.getElementById('prompt').value = prompt;
        }

        function generate() {
            const prompt = document.getElementById('prompt').value;
            if (!uploadedImage || !prompt) {
                alert('Please upload an image and enter a prompt.');
                return;
            }

            // Simulate image generation with canvas
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                // Apply color filter (e.g., sepia for simulation)
                ctx.globalCompositeOperation = 'multiply';
                ctx.fillStyle = 'rgba(255, 200, 100, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'source-over';
                // Add stylized text
                ctx.font = 'bold 48px Arial';
                ctx.fillStyle = '#fff';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 5;
                ctx.strokeText(`Simulated: ${prompt}`, 20, 60);
                ctx.fillText(`Simulated: ${prompt}`, 20, 60);
                simulatedImage = canvas.toDataURL();
                document.getElementById('after-img').src = simulatedImage;
                document.getElementById('comparison').style.display = 'block';
                document.getElementById('buttons').style.display = 'flex';
            };
            img.src = uploadedImage;
        }

        // Slider functionality
        const slider = document.getElementById('slider');
        const afterImg = document.getElementById('after-img');
        let isDragging = false;

        slider.addEventListener('mousedown', () => isDragging = true);
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const rect = slider.parentElement.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percent = Math.max(0, Math.min(100, (x / rect.width) * 100));
                slider.style.left = percent + '%';
                afterImg.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;
            }
        });

        function download() {
            if (!simulatedImage) return;
            const link = document.createElement('a');
            link.href = simulatedImage;
            link.download = 'simulated-outfit.png';
            link.click();
        }

        function share() {
            const prompt = document.getElementById('prompt').value;
            const text = `Check out my simulated outfit in ${prompt} style using Flux One-Prompt Outfit Simulator! #FluxOutfitSimulator`;
            const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
