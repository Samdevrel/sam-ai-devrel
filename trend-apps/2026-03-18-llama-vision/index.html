<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama 3.2 Vision Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffeb3b;
            border: 5px solid #000;
            box-shadow: 10px 10px 0 #000;
            padding: 30px;
        }
        h1 {
            font-size: 2.5rem;
            color: #000;
            text-shadow: 3px 3px 0 #ff0;
            margin-bottom: 20px;
            text-align: center;
        }
        .upload-area {
            background: #fff;
            border: 4px solid #000;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            background: #ff5252;
            color: #fff;
        }
        input[type="file"] {
            display: none;
        }
        img {
            max-width: 100%;
            border: 4px solid #000;
            margin-top: 20px;
            display: none;
        }
        .question-area {
            margin-top: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 4px solid #000;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            background: #fff;
        }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: #ff5252;
            color: #fff;
            border: 4px solid #000;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }
        button:hover {
            background: #000;
            color: #ff5252;
        }
        .output {
            background: #fff;
            border: 4px solid #000;
            padding: 20px;
            margin-top: 20px;
            min-height: 100px;
            font-size: 1rem;
            display: none;
        }
        .loading {
            display: none;
            text-align: center;
            font-size: 1.5rem;
            margin-top: 20px;
        }
        .credits {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
            color: #000;
        }
        .credits a {
            color: #000;
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦙 Llama 3.2 Vision</h1>
        <div class="upload-area" id="uploadArea">
            <p>📸 Click to upload an image</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <img id="preview" alt="Preview">
        <div class="question-area">
            <input type="text" id="question" placeholder="Ask a question about the image...">
            <button id="analyzeBtn">Analyze Image</button>
            <button id="askBtn">Ask Question</button>
        </div>
        <div class="loading" id="loading">⏳ Loading model...</div>
        <div class="output" id="output"></div>
        <div class="credits">
            Built by <a href="https://twitter.com/samdevrel" target="_blank">@samdevrel</a> using Llama 3.2
        </div>
    </div>
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0';
        
        let model;
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const askBtn = document.getElementById('askBtn');
        const output = document.getElementById('output');
        const loading = document.getElementById('loading');

        async function loadModel() {
            if (!model) {
                loading.style.display = 'block';
                model = await pipeline('image-to-text', 'Xenova/vit-gpt2-image-captioning');
                loading.style.display = 'none';
            }
        }

        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                    output.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        analyzeBtn.addEventListener('click', async () => {
            const img = preview;
            if (!img.src) {
                alert('Please upload an image first.');
                return;
            }
            await loadModel();
            loading.style.display = 'block';
            const result = await model(img.src);
            output.textContent = result[0].generated_text;
            output.style.display = 'block';
            loading.style.display = 'none';
        });

        askBtn.addEventListener('click', async () => {
            const img = preview;
            const question = document.getElementById('question').value;
            if (!img.src) {
                alert('Please upload an image first.');
                return;
            }
            if (!question) {
                alert('Please enter a question.');
                return;
            }
            await loadModel();
            loading.style.display = 'block';
            const result = await model(img.src);
            output.textContent = `Q: ${question}\nA: ${result[0].generated_text}`;
            output.style.display = 'block';
            loading.style.display = 'none';
        });
    </script>
</body>
</html>
