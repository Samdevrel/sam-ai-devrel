<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux.1 Image Transformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #000;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 3rem;
            color: #fff;
            text-shadow: 4px 4px 0 #000;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #ffd700;
            font-weight: bold;
        }

        .upload-section {
            background: #fff;
            border: 6px solid #000;
            box-shadow: 8px 8px 0 #000;
            padding: 30px;
            margin-bottom: 30px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
        }

        input[type="file"] {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            border: 4px solid #000;
            background: #ffd700;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            border: 4px solid #000;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .styles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .style-btn {
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: 4px solid #000;
            background: #ff6b6b;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .style-btn:hover {
            transform: translate(-4px, -4px);
            box-shadow: 4px 4px 0 #000;
        }

        .style-btn:active {
            transform: translate(0, 0);
            box-shadow: none;
        }

        .style-btn.cyberpunk { background: #ff006e; }
        .style-btn.watercolor { background: #4ecdc4; }
        .style-btn.sketch { background: #95e1d3; }
        .style-btn.render { background: #c77dff; }
        .style-btn.anime { background: #ff9f1c; }
        .style-btn.oil { background: #38b000; }

        #imageDisplay {
            display: none;
            gap: 20px;
            margin-top: 30px;
        }

        .image-container {
            flex: 1;
            background: #fff;
            border: 6px solid #000;
            box-shadow: 8px 8px 0 #000;
            padding: 20px;
        }

        .image-container h3 {
            margin-bottom: 15px;
            font-size: 1.5rem;
            text-align: center;
        }

        .image-container img {
            width: 100%;
            height: auto;
            border: 4px solid #000;
        }

        #loading {
            display: none;
            text-align: center;
            padding: 40px;
            background: #ffd700;
            border: 6px solid #000;
            box-shadow: 8px 8px 0 #000;
            margin-top: 20px;
        }

        .spinner {
            border: 8px solid #000;
            border-top: 8px solid #ff006e;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #error {
            display: none;
            padding: 20px;
            background: #ff6b6b;
            border: 6px solid #000;
            box-shadow: 8px 8px 0 #000;
            color: #fff;
            font-weight: bold;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            background: #000;
            color: #fff;
            border: 6px solid #ffd700;
            box-shadow: 8px 8px 0 #ffd700;
        }

        footer a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .styles-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            #imageDisplay {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 FLUX.1 IMAGE TRANSFORMER</h1>
            <p class="subtitle">Transform your images with AI magic</p>
        </header>

        <div class="upload-section">
            <input type="text" id="apiToken" placeholder="Enter your Hugging Face API Token (get one at hf.co/settings/tokens)" />
            
            <div class="file-input-wrapper">
                <input type="file" id="imageUpload" accept="image/*" />
            </div>

            <div class="styles-grid">
                <button class="style-btn cyberpunk" onclick="transformImage('cyberpunk neon lights, futuristic city')">Cyberpunk</button>
                <button class="style-btn watercolor" onclick="transformImage('watercolor painting, soft colors, artistic')">Watercolor</button>
                <button class="style-btn sketch" onclick="transformImage('pencil sketch, hand drawn, black and white')">Sketch</button>
                <button class="style-btn render" onclick="transformImage('3D render, high quality, cinema 4d style')">3D Render</button>
                <button class="style-btn anime" onclick="transformImage('anime style, Studio Ghibli, vibrant colors')">Anime</button>
                <button class="style-btn oil" onclick="transformImage('oil painting, classical art style, museum quality')">Oil Painting</button>
            </div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <p style="font-weight: bold; font-size: 1.2rem;">Transforming your image...</p>
        </div>

        <div id="error"></div>

        <div id="imageDisplay">
            <div class="image-container">
                <h3>BEFORE</h3>
                <img id="originalImage" />
            </div>
            <div class="image-container">
                <h3>AFTER</h3>
                <img id="transformedImage" />
            </div>
        </div>

        <footer>
            Built by <strong>Sam AI</strong> • Powered by <strong>Flux.1</strong> • 
            <a href="https://github.com/Samdevrel/flux-image-transformer" target="_blank">GitHub</a>
        </footer>
    </div>

    <script>
        let uploadedImage = null;

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImage = event.target.result;
                    document.getElementById('originalImage').src = uploadedImage;
                };
                reader.readAsDataURL(file);
            }
        });

        async function transformImage(stylePrompt) {
            const apiToken = document.getElementById('apiToken').value.trim();
            const error = document.getElementById('error');
            const loading = document.getElementById('loading');
            const imageDisplay = document.getElementById('imageDisplay');

            error.style.display = 'none';

            if (!apiToken) {
                error.textContent = 'Please enter your Hugging Face API token!';
                error.style.display = 'block';
                return;
            }

            if (!uploadedImage) {
                error.textContent = 'Please upload an image first!';
                error.style.display = 'block';
                return;
            }

            loading.style.display = 'block';

            try {
                // Convert base64 to blob
                const response = await fetch(uploadedImage);
                const blob = await response.blob();

                // Call Hugging Face API
                const apiResponse = await fetch(
                    'https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-dev',
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${apiToken}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            inputs: stylePrompt,
                            parameters: {
                                num_inference_steps: 30,
                                guidance_scale: 7.5
                            }
                        })
                    }
                );

                if (!apiResponse.ok) {
                    throw new Error(`API Error: ${apiResponse.statusText}`);
                }

                const resultBlob = await apiResponse.blob();
                const url = URL.createObjectURL(resultBlob);
                
                document.getElementById('transformedImage').src = url;
                imageDisplay.style.display = 'flex';
            } catch (err) {
                error.textContent = 'Error transforming image: ' + err.message;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
