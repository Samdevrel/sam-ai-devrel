<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Security Monitor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #e0e0e0;
            overflow-x: hidden;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5em;
            background: linear-gradient(45deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric {
            background: linear-gradient(145deg, #2a2d3a, #1e1e2f);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }
        .metric:hover {
            transform: translateY(-5px);
        }
        .metric h3 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
            color: #00d4ff;
        }
        .metric .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #00ff88;
        }
        .activity-log {
            background: linear-gradient(145deg, #2a2d3a, #1e1e2f);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            max-height: 400px;
            overflow-y: auto;
        }
        .activity-log h3 {
            margin: 0 0 15px 0;
            color: #00d4ff;
        }
        .log-entry {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #333;
            animation: fadeIn 0.5s ease;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .threat-alert {
            background: linear-gradient(145deg, #2a2d3a, #1e1e2f);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
            transition: all 0.5s ease;
        }
        .threat-alert h3 {
            margin: 0 0 10px 0;
            color: #00d4ff;
        }
        .threat-alert .status {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.5s ease;
        }
        .safe { background-color: #00ff88; color: #000; }
        .warning { background-color: #ffff00; color: #000; }
        .threat { background-color: #ff0040; color: #fff; }
        .threat-alert .message {
            margin-top: 10px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Agent Security Monitor</h1>
        </header>
        <div class="dashboard">
            <div class="metric">
                <h3>Requests/Min</h3>
                <div class="value" id="requests-min">0</div>
            </div>
            <div class="metric">
                <h3>Threat Level</h3>
                <div class="value" id="threat-level">Low</div>
            </div>
            <div class="metric">
                <h3>Blocked Attempts</h3>
                <div class="value" id="blocked-attempts">0</div>
            </div>
        </div>
        <div class="activity-log">
            <h3>Real-Time Activity Log</h3>
            <div id="log-entries"></div>
        </div>
        <div class="threat-alert" id="threat-alert">
            <h3>Threat Detection</h3>
            <div class="status safe" id="alert-status">Safe</div>
            <div class="message" id="alert-message">All systems operational.</div>
        </div>
    </div>

    <script>
        let requestsMin = 0;
        let threatLevel = 'Low';
        let blockedAttempts = 0;
        let logEntries = [];

        const requestsMinEl = document.getElementById('requests-min');
        const threatLevelEl = document.getElementById('threat-level');
        const blockedAttemptsEl = document.getElementById('blocked-attempts');
        const logEntriesEl = document.getElementById('log-entries');
        const alertStatusEl = document.getElementById('alert-status');
        const alertMessageEl = document.getElementById('alert-message');
        const threatAlertEl = document.getElementById('threat-alert');

        function updateMetrics() {
            requestsMin = Math.floor(Math.random() * 100) + 50; // Simulate 50-150 requests/min
            requestsMinEl.textContent = requestsMin;
            blockedAttempts += Math.floor(Math.random() * 3); // Add 0-2 blocked attempts
            blockedAttemptsEl.textContent = blockedAttempts;
        }

        function addLogEntry() {
            const now = new Date();
            const timestamp = now.toLocaleTimeString();
            const actions = ['API call to model X', 'Data retrieval', 'User query processed', 'Suspicious activity detected', 'Normal operation'];
            const action = actions[Math.floor(Math.random() * actions.length)];
            const entry = `<div class="log-entry"><span>${action}</span><span>${timestamp}</span></div>`;
            logEntries.push(entry);
            if (logEntries.length > 20) {
                logEntries.shift(); // Keep only last 20 entries
            }
            logEntriesEl.innerHTML = logEntries.join('');
            logEntriesEl.scrollTop = logEntriesEl.scrollHeight; // Auto-scroll to bottom
        }

        function updateThreatDetection() {
            const rand = Math.random();
            let status, message, className;
            if (rand < 0.7) {
                status = 'Safe';
                message = 'All systems operational.';
                className = 'safe';
                threatLevel = 'Low';
            } else if (rand < 0.9) {
                status = 'Warning';
                message = 'Potential anomaly detected.';
                className = 'warning';
                threatLevel = 'Medium';
            } else {
                status = 'Threat';
                message = 'Immediate action required!';
                className = 'threat';
                threatLevel = 'High';
            }
            alertStatusEl.textContent = status;
            alertMessageEl.textContent = message;
            alertStatusEl.className = `status ${className}`;
            threatLevelEl.textContent = threatLevel;
        }

        // Initial setup
        updateMetrics();
        updateThreatDetection();
        addLogEntry();

        // Simulate live updates
        setInterval(updateMetrics, 2000); // Update metrics every 2 seconds
        setInterval(addLogEntry, 3000); // Add log entry every 3 seconds
        setInterval(updateThreatDetection, 5000); // Update threat detection every 5 seconds
    </script>
</body>
</html>
