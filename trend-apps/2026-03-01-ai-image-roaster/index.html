<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Roaster</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-align: center;
            border: 10px solid #ff00ff;
            padding: 10px;
            background-color: #ffff00;
            color: #000;
        }
        .upload-area {
            width: 80%;
            max-width: 600px;
            height: 300px;
            border: 10px dashed #00ffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            background-color: #333;
            position: relative;
            cursor: pointer;
        }
        .upload-area.dragover {
            border-color: #ff0000;
            background-color: #555;
        }
        .upload-area input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .upload-text {
            font-size: 1.5em;
            text-align: center;
        }
        .loading {
            display: none;
            font-size: 2em;
            color: #ffaa00;
            margin-top: 20px;
        }
        .result {
            display: none;
            font-size: 1.5em;
            text-align: center;
            border: 10px solid #00ff00;
            padding: 20px;
            background-color: #222;
            margin-top: 20px;
            max-width: 600px;
        }
        .error {
            display: none;
            font-size: 1.5em;
            color: #ff0000;
            text-align: center;
            border: 10px solid #ff0000;
            padding: 20px;
            background-color: #222;
            margin-top: 20px;
            max-width: 600px;
        }
        button {
            font-family: inherit;
            font-size: 1.2em;
            padding: 10px 20px;
            border: 5px solid #fff;
            background-color: #000;
            color: #fff;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <h1>AI Image Roaster</h1>
    <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*">
        <div class="upload-text">Drag & drop an image here or click to upload</div>
    </div>
    <div class="loading" id="loading">Roasting your image... 🔥</div>
    <div class="result" id="result"></div>
    <div class="error" id="error"></div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const error = document.getElementById('error');

        let imagePipeline;

        // Load the model on page load
        async function loadModel() {
            try {
                imagePipeline = await pipeline('image-to-text', 'Xenova/vit-gpt2-image-captioning');
            } catch (err) {
                showError('Failed to load the AI model. Please refresh and try again.');
            }
        }
        loadModel();

        // Drag and drop functionality
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                processFile(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFile(e.target.files[0]);
            }
        });

        async function processFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('Please upload a valid image file.');
                return;
            }
            hideMessages();
            loading.style.display = 'block';

            try {
                const image = await loadImage(file);
                const output = await imagePipeline(image);
                const caption = output[0].generated_text;
                const roast = generateRoast(caption);
                result.textContent = roast;
                result.style.display = 'block';
            } catch (err) {
                showError('Oops! Something went wrong roasting your image. Try another one.');
            } finally {
                loading.style.display = 'none';
            }
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }

        function generateRoast(caption) {
            const prefixes = [
                "Oh wow, ",
                "Another classic: ",
                "Bold choice: ",
                "Groundbreaking: ",
                "Truly revolutionary: "
            ];
            const suffixes = [
                ". How original!",
                ". Your creativity knows no bounds... said no one ever.",
                ". Picasso would be proud... of something else.",
                ". This screams 'art'!",
                ". Masterpiece or mistake? You decide."
            ];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
            return prefix + caption.toLowerCase() + suffix;
        }

        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
        }

        function hideMessages() {
            result.style.display = 'none';
            error.style.display = 'none';
        }
    </script>
</body>
</html>
